name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le projet Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Entretien Peugeot 106" com.peugeot106.entretien --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: entretien-peugeot-106-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
